name: Audit

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  audit:
    name: make audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep shellcheck

      - name: Run audit
        run: make audit
